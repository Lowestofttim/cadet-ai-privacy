<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    This page used to carry a FULL SECOND COPY of the Cadet AI privacy policy
    (audit finding M-10). It drifted from the canonical one and ended up making
    different promises about who the data controller is, whether a parent can
    get an under-13 in, how long a TANGO chat is kept and which company
    synthesises the voice. For a children's app that is two competing normative
    privacy policies, and a reader had no way to tell which one bound us.

    So there is now exactly ONE policy, at the canonical URL below, and this
    page is a redirect to it and nothing else. Do not re-add policy text here.
    .github/workflows/policy-parity.yml fails the build if you do.
  -->
  <title>Cadet AI Privacy Policy has moved</title>
  <link rel="canonical" href="https://cadetai.co.uk/privacy.html">
  <meta http-equiv="refresh" content="0; url=https://cadetai.co.uk/privacy.html">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="The Cadet AI privacy policy now lives at cadetai.co.uk/privacy.html.">
  <style>
    body { margin: 0; background: #f7f8f5; color: #1c2419; line-height: 1.6; font-size: 17px;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem; }
    a { color: #1d5c21; }
  </style>
</head>
<body>
  <main>
    <h1>The Cadet AI Privacy Policy has moved</h1>
    <p>You should be redirected automatically. If not, read it here:</p>
    <p><a href="https://cadetai.co.uk/privacy.html">https://cadetai.co.uk/privacy.html</a></p>
    <p>That page is the single canonical Cadet AI privacy policy.</p>
  </main>
</body>
</html>
